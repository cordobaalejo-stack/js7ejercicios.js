<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ToDo List</title>
  <style>
   body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #232526, #414345);
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .app {
    background: #ffffff;
    padding: 20px;
    border-radius: 15px;
    width: 400px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  }

  h1 { 
    text-align: center; 
    color: #1f2937;
  }

  form {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    background: #f9fafb;
  }

  input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
  }

  button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    transition: 0.3s;
  }

  button:hover {
    background: #1d4ed8;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin-bottom: 8px;
    background: #f9fafb;
    border-radius: 8px;
    transition: all 0.3s ease;
    border: 1px solid #e5e7eb;
  }

  li:hover {
    transform: scale(1.02);
  }

  .completada {
    text-decoration: line-through;
    opacity: 0.6;
    color: #6b7280;
  }

  .delete-btn {
    background: #ef4444;
  }

  .delete-btn:hover {
    background: #dc2626;
  }

  .contador {
    text-align: right;
    margin-top: 10px;
    font-weight: bold;
    color: #374151;
  }
  </style>
</head>
<body>

<div class="app">
    <div class="container">
  <h1>Lista de Tareas</h1>

  <form id="form">
    <input type="text" id="input" placeholder="Nueva tarea...">
    <button type="submit">Agregar</button>
  </form>

  <ul id="lista"></ul>

  <div class="contador">
    Pendientes: <span id="pendientes">0</span>
  </div>
</div>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const lista = document.getElementById("lista");
  const pendientes = document.getElementById("pendientes");

  const actualizarContador = () => {
    const tareas = lista.querySelectorAll("li");
    const pendientesCount = [...tareas].filter(t => !t.classList.contains("completada")).length;
    pendientes.textContent = pendientesCount;
  };

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const texto = input.value.trim();
    if (!texto) return;

    const li = document.createElement("li");

    const span = document.createElement("span");
    span.textContent = texto;

    const btn = document.createElement("button");
    btn.textContent = "X";
    btn.classList.add("delete-btn");

    // Marcar como completada
    span.addEventListener("click", () => {
      li.classList.toggle("completada");
      actualizarContador();
    });

    // Eliminar
    btn.addEventListener("click", () => {
      li.remove();
      actualizarContador();
    });

    li.appendChild(span);
    li.appendChild(btn);
    lista.appendChild(li);

    input.value = "";

    actualizarContador();
  });
</script>

</body>
</html>
